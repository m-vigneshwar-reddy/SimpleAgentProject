[project]
name = "travalplanproject"
version = "0.1.0"
description = "AI-assisted travel planning Streamlit application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.20.0,<1.30.0",
    "requests>=2.30.0,<3.0.0",
    "plotly>=5.0.0,<6.0.0",
    "reportlab>=3.6.0,<4.0.0",
    "openpyxl>=3.1.0,<4.0.0"
]

[project.scripts]
start = "streamlit run app_ultimate.py"
